<!DOCTYPE html>
<html>
<head>
	<title>VR Architectural Walkthrough with WebXR MODDED</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" sizes="180x180" href="./css/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./css/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./css/favicon/favicon-16x16.png">
    <link rel="manifest" href="./css/favicon/site.webmanifest">
    <link rel="mask-icon" href="./css/favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <!-- end favicon -->
    <link type="text/css" rel="stylesheet" href="./css/common.css">
    <style>
        body{
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <script src="./libs/fas.js"></script>
	<script type="module">
        import { App } from './app.js';
        
		document.addEventListener("DOMContentLoaded", function(){
			const app = new App();
			window.app = app;

	            // Update position in HUD every frame
	            const coordsEl = document.getElementById('coords');
	            const updateCoords = () => {
	                if (app?.dolly && coordsEl) {
	                    const pos = app.dolly.position;
	                    const dir = new THREE.Vector3();
	                    app.camera.getWorldDirection(dir);
	                    coordsEl.innerText = 
	                        `Position: (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})\n` +
	                        `Direction: (${dir.x.toFixed(2)}, ${dir.y.toFixed(2)}, ${dir.z.toFixed(2)})`;
	                }
	                requestAnimationFrame(updateCoords);
	            };
	            updateCoords();
			
		});
	</script>
</body>
</html>
